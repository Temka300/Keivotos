name: tests

# Steps 1-3 of docs/important/COMMIT_CHECKLIST.md, run on every push so the
# suite is proven somewhere other than one laptop. Windows because that is what
# Keivotos ships: the folder picker, release layout and path guards are all
# Windows-shaped.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync the test environment
        run: uv sync --group dev

      - name: Compile check
        run: uv run python -m compileall -q backend scripts app.py

      - name: Tests
        run: uv run python -m pytest -q

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type and template check
        run: npm run check

      - name: Build
        run: npm run build
